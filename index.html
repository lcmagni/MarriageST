<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Sveva &amp; Tanguy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Mulish:wght@400;600;700&display=swap">
<style>
/* Layout: a single column "invitation card" with a sticky section bar; limestone, olive and Adriatic blue from the Valle d'Itria */
:root{
  --bg:#F2F3EE; --surface:#FFFFFF; --ink:#1F2A22; --muted:#5B675C; --line:#D9DED2;
  --olive:#56682A; --olive-soft:#E6EBD8; --sea:#2C5C78; --warn:#9A5B12; --warn-soft:#F7ECDD;
  --display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body:"Mulish", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141915; --surface:#1C231D; --ink:#E8ECE3; --muted:#A1AC9E; --line:#2D362E;
  --olive:#AFC274; --olive-soft:#26301F; --sea:#86B8D4; --warn:#E3B06A; --warn-soft:#33281A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141915; --surface:#1C231D; --ink:#E8ECE3; --muted:#A1AC9E; --line:#2D362E;
  --olive:#AFC274; --olive-soft:#26301F; --sea:#86B8D4; --warn:#E3B06A; --warn-soft:#33281A; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 56px}
a{color:var(--sea)}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;line-height:1.15;margin:0}
p{margin:0}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

.topbar{display:flex;justify-content:flex-end}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);font:600 12px var(--body);letter-spacing:.08em;padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--olive);color:var(--surface)}

.hero{text-align:center;padding-block:14px 28px;display:grid;gap:22px;justify-items:center}
.hero-txt{display:grid;gap:8px;justify-items:center}
@media (min-width:660px){.hero{grid-template-columns:auto minmax(0,1fr);text-align:left;justify-items:start;align-items:center;gap:40px}.hero-txt{justify-items:start}}
.hero svg{width:44px;height:44px;color:var(--olive)}
.hero h1{font-size:clamp(44px, 11vw, 76px);font-weight:500;font-style:italic;letter-spacing:.01em}
.hero .amp{color:var(--olive)}
.when{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600}
.count{font-family:var(--display);font-size:20px;color:var(--sea)}
.count b{font-variant-numeric:tabular-nums}

nav.tabs{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:24px}
.tabs-in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:12px 12px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--olive)}
.tabs button.cta{color:var(--olive)}

section{display:grid;gap:22px}
.lead{font-size:17px;color:var(--ink);max-width:62ch}
.muted{color:var(--muted)}
h2{font-size:32px}
h3{font-size:22px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);font-weight:700}

.venue{display:grid;gap:4px;padding:16px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.venue strong{font-family:var(--display);font-size:22px;font-weight:600}

.timeline{display:grid;gap:0;border-left:1px solid var(--line);margin-left:6px}
.ev{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0 14px 18px;position:relative}
.ev::before{content:"";position:absolute;left:-5px;top:20px;width:9px;height:9px;border-radius:50%;background:var(--olive)}
.ev time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--sea);font-size:14px;padding-top:3px}
.ev h3{font-size:21px}
.ev div{min-width:0}
.dress{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}

.rates{width:100%;border-collapse:collapse;font-size:15px}
.rates td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.rates td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;padding-left:12px}
.rates small{display:block;color:var(--muted);font-size:13px;line-height:1.45}

.note{padding:12px 14px;border-radius:8px;background:var(--olive-soft);font-size:15px}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.note.warn b{color:var(--warn)}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--olive);background:var(--olive);color:var(--surface);
  font:700 15px var(--body);padding:11px 18px;border-radius:8px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--olive)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.places{display:grid;gap:26px}
.cat{display:grid;gap:10px}
.place{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.place h3{font-size:20px}
.place .t{font-size:13px;color:var(--sea);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:4px}
.place p{grid-column:1/-1;color:var(--muted);font-size:15px}

.qa{display:grid;gap:8px}
details{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 16px}
summary{cursor:pointer;font-weight:700;padding:13px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--olive);font-size:20px;line-height:1}
details[open] summary::after{content:"–"}
details > div{padding-bottom:14px;color:var(--ink)}

/* booking */
.form{display:grid;gap:18px;padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{display:grid;gap:5px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
input,select,textarea{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px 11px;width:100%;min-width:0}
textarea{resize:vertical}
fieldset{border:0;padding:0;margin:0;display:grid;gap:10px}
legend{font-family:var(--display);font-size:22px;font-weight:600;margin-bottom:6px;padding:0}
.night{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.night .d{font-weight:700;font-size:15px}
.night .d small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-top:4px}
.sum .v{font-family:var(--display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.msgs{display:grid;gap:8px}
.out{display:grid;gap:12px}
.out textarea{font-size:14px;line-height:1.55;background:var(--surface)}
.addr{font-weight:700;user-select:all}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);font:700 13px var(--body);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sea);color:var(--surface)}
ol.send{list-style:none;counter-reset:st;margin:0;padding:0;display:grid;gap:16px}
ol.send li{counter-increment:st;display:grid;gap:8px;padding-left:44px;position:relative;min-width:0}
ol.send li::before{content:counter(st);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--olive);color:var(--surface);font:700 15px var(--body);display:grid;place-items:center}
ol.send li > p{font-weight:600;padding-top:3px}
.cp{display:flex;gap:8px;flex-wrap:wrap}
.cp input{flex:1 1 220px;background:var(--surface)}
.toast{font-size:13px;color:var(--olive);font-weight:700;min-height:1em}

/* splash: one fixed look over the photo, light text on a dark scrim in both themes */
.splash{position:fixed;inset:0;z-index:20;display:grid;place-items:end center;overflow-y:auto;color:#FFFFFF;
  background:#1A1F17;
  padding:calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.splash-img{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
@media (min-aspect-ratio:5/4){
  .splash{grid-template-columns:1fr 1fr;place-items:center}
  .splash-img{right:50%;width:50%;object-position:50% 20%}
  .splash::before{display:none}
  .splash-in{grid-column:2}
}
.splash::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg, rgba(20,25,18,0) 25%, rgba(20,25,18,.55) 55%, rgba(20,25,18,.9) 100%);pointer-events:none}
.splash-in{position:relative;display:grid;gap:10px;justify-items:center;text-align:center;max-width:420px;width:100%;animation:rise .9s ease-out both}
.splash svg{width:44px;height:44px;color:#E4EDC8}
.splash h1{font-size:clamp(46px, 13vw, 76px);font-weight:500;font-style:italic;color:#FFFFFF;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.splash .amp{color:#D6E3A8}
.splash .when{color:rgba(255,255,255,.85)}
.splash .pick{margin-top:14px;color:rgba(255,255,255,.8);font-size:13px}
.choices{display:grid;gap:10px;width:100%;max-width:280px}
.choices .btn{font-size:16px;padding:13px 18px;background:rgba(255,255,255,.94);border-color:transparent;color:#2E3A1A}
.choices .btn:hover{background:#FFFFFF}
@keyframes rise{from{opacity:.2;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.splash-in{animation:none}}

/* photos */
figure{margin:0}
.arch{width:min(300px, 72vw);aspect-ratio:4/5;max-width:100%;border-radius:999px 999px 14px 14px;overflow:hidden;
  box-shadow:0 0 0 6px var(--bg), 0 0 0 7px var(--line)}
.arch img,.photo img{width:100%;height:100%;object-fit:cover;display:block}
.arch img{object-position:50% 50%}
.photo{border-radius:12px;overflow:hidden;max-width:100%}
.photo figcaption{font-family:var(--display);font-style:italic;font-size:17px;color:var(--muted);padding-top:8px}
.portrait{width:min(380px,100%);justify-self:center;text-align:center}
.portrait .photo{aspect-ratio:4/5}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center}
.split .photo{aspect-ratio:3/4}
@media (max-width:560px){.split{grid-template-columns:1fr}.split .photo{aspect-ratio:4/3}}
.brunch{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;align-items:stretch;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.brunch .photo{border-radius:8px;min-height:180px}
.brunch .photo img{object-position:50% 10%}
.brunch > div{display:grid;gap:6px;align-content:center;min-width:0}
.brunch strong{font-family:var(--display);font-size:22px;font-weight:600}
@media (max-width:520px){.brunch{grid-template-columns:1fr}.brunch .photo{aspect-ratio:4/3;min-height:0}}
footer{margin-top:40px;text-align:center;font-size:13px;color:var(--muted)}
@media (max-width:520px){ .ev{grid-template-columns:1fr;gap:2px} .night{grid-template-columns:1fr;gap:6px} .form{padding:16px} }
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.gate{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--bg);overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.gate form{display:grid;gap:14px;justify-items:center;text-align:center;width:100%;max-width:340px}
.gate svg{width:48px;height:48px;color:var(--olive)}
.gate h1{font-size:clamp(40px, 11vw, 60px);font-weight:500;font-style:italic}
.gate .amp{color:var(--olive)}
.gate p{color:var(--muted);font-size:14px}
.gate input{text-align:center;font-size:18px;letter-spacing:.08em}
.gate .btn{width:100%}
.gate .err{color:var(--warn);font-weight:700;min-height:1.3em}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M20 34 L32 8 L44 34"/><circle cx="32" cy="6" r="2" fill="currentColor"/>
      <path d="M16 34h32v22H16z"/><path d="M28 56V45a4 4 0 0 1 8 0v11"/>
    </svg>
    <h1>Sveva <span class="amp">&amp;</span> Tanguy</h1>
    <p class="when">25.06.2027 · Fasano, Puglia</p>
    <p>Enter the guest passkey · Saisissez le code invité · Inserisci il codice ospite</p>
    <input id="pass" type="password" aria-label="Passkey" autocapitalize="none" spellcheck="false">
    <button class="btn" type="submit">Enter · Entrer · Entra</button>
    <p class="err" id="gateErr" aria-live="polite"></p>
  </form>
</div>

function vTodo(t){
  return `<section><h2>${t.todoH}</h2><p class="lead">${t.todoP}</p><div class="places">${t.cats.map((c,ci)=>`<div class="cat"><span class="eyebrow">${c}</span>${
    PLACES.filter(p=>p[0]===ci).map(p=>`<div class="place"><h3>${typeof p[1]==="string"?p[1]:p[1][lang]}</h3><span class="t">${p[2]}</span><p>${p[3][lang]}</p></div>`).join("")}</div>`).join("")}</div></section>`}

function vQA(t){return `<section><h2>${t.qaH}</h2><div class="qa">${t.qa.map(q=>`<details><summary>${q[0]}</summary><div>${q[1]==="__CONTACTS__"?contacts():q[1]}</div></details>`).join("")}</div></section>`}

function vBook(t){
  const r=ROOM[lang];
  const types=["trullo","double","triple","quad"];
  const dopt=(arr,sel)=>arr.map(i=>`<option value="${i}" ${+sel===i?"selected":""}>${fdate(DAYS[i],lang,{weekday:"long",day:"numeric",month:"long"})}</option>`).join("");
  const ropt=(sel,noTrullo)=>types.filter(x=>!(noTrullo&&x==="trullo")).map(x=>`<option value="${x}" ${sel===x?"selected":""}>${r[x]} · ${eur(PRICE[x],lang)}/${lang==="it"?"notte":lang==="fr"?"nuit":"night"}</option>`).join("");
  return `<section>
  <div><h2>${t.bookH}</h2><p class="lead" style="margin-top:8px">${t.bookP}</p></div>
  <form class="form" id="bf" novalidate>
   <fieldset><legend>${t.staying}</legend>
    <label>${t.roomT}<select id="room">${ropt(F.room,false)}</select></label>
    <div class="grid2"><label>${t.ci}<select id="ci">${dopt([0,1,2],F.ci)}</select></label>
     <label>${t.co}<select id="co">${dopt([1,2,3],F.co)}</select></label></div>
    <div id="satWrap" hidden><label>${t.satRoom}<select id="satRoom">${ropt(F.satRoom,true)}</select></label><p class="muted" style="font-size:13px;margin-top:6px">${t.satNote}</p></div>
    <div class="grid2"><label>${t.guests}<input id="guests" type="number" min="1" max="20" inputmode="numeric" value="${F.guests}"></label>
     <label>${t.rooms}<input id="rooms" type="number" min="1" max="10" inputmode="numeric" value="${F.rooms}"></label></div>
    <div class="sum"><span class="muted">${t.est}<br><small id="nn"></small></span><span class="v" id="tot"></span></div>
    <p class="muted" style="font-size:13px">${t.estNote}</p>
    <div class="msgs" id="msgs"></div>
   </fieldset>
   <fieldset><legend>${t.you}</legend>
    <div class="grid2"><label>${t.first}<input id="first" autocomplete="given-name" value="${esc(F.first)}"></label><label>${t.last}<input id="last" autocomplete="family-name" value="${esc(F.last)}"></label>
     <label>${t.email}<input id="email" type="email" autocomplete="email" value="${esc(F.email)}"></label><label>${t.phone}<input id="phone" type="tel" autocomplete="tel" value="${esc(F.phone)}"></label></div>
    <label>${t.notes}<textarea id="notes" rows="2" placeholder="${t.notesPh}">${esc(F.notes)}</textarea></label>
   </fieldset>
  </form>
  <div class="out">
   <div><h3>${t.outH}</h3><p class="muted" style="margin-top:6px">${t.outP}</p></div>
   <div class="row" style="gap:8px"><span class="muted" style="font-size:13px">${t.emailLang}</span><span class="seg" role="group"><button type="button" data-el="it" aria-pressed="${F.elang==="it"}">IT</button><button type="button" data-el="en" aria-pressed="${F.elang==="en"}">EN</button><button type="button" data-el="fr" aria-pressed="${F.elang==="fr"}">FR</button></span></div>
   <ol class="send">
    <li><p>${t.s1}</p><div class="cp"><input id="oaddr" readonly value="${VENUE_EMAIL}" aria-label="${t.to}"><button type="button" class="btn" data-copy="oaddr">${t.copyA}</button></div></li>
    <li><p>${t.s2}</p><div class="cp"><input id="osubj" readonly aria-label="${t.subj}"><button type="button" class="btn" data-copy="osubj">${t.copyS}</button></div></li>
    <li><p>${t.s3}</p><textarea id="obody" rows="16" readonly aria-label="${t.body}"></textarea><div><button type="button" class="btn" data-copy="obody">${t.copyB}</button></div></li>
    <li><p>${t.s4}</p></li>
   </ol>
   <p class="toast" id="toast" aria-live="polite"></p>
  </div>
  </section>`}

/* ---------- email ---------- */
function compute(){
  const ci=+F.ci, co=+F.co, bad=!(co>ci);
  const sel=[]; if(!bad) for(let k=ci;k<co;k++) sel.push({d:DAYS[k], type:(k===2&&F.room==="trullo")?F.satRoom:F.room});
  const rooms=Math.max(1,+F.rooms||1), guests=Math.max(1,+F.guests||1);
  const total=sel.reduce((a,x)=>a+PRICE[x.type],0)*rooms;
  const minCap=sel.length?Math.min(...sel.map(x=>CAP[x.type]))*rooms:0;
  return {ci,co,bad,sel,rooms,guests,total,minCap,needSat:F.room==="trullo"&&!bad&&co===3};
}

function refresh(){
  const t=T[lang], c=compute(), el=F.elang;
  const $=id=>document.getElementById(id);
  $("satWrap").hidden=!c.needSat;
  $("tot").textContent = c.bad ? "–" : eur(c.total,lang);
  $("nn").textContent = c.bad ? "" : `${t.nights(c.sel.length)} × ${c.rooms} ${t.rooms.toLowerCase()}`;
  let m="";
  if(c.bad) m=`<p class="note warn"><b>${t.errDates}</b></p>`;
  else if(c.guests>c.minCap) m=`<p class="note warn">${t.warnCap(c.guests,c.minCap)}</p>`;
  $("msgs").innerHTML=m;
  document.querySelectorAll('[data-copy="osubj"],[data-copy="obody"]').forEach(b=>b.disabled=c.bad);
  if(c.bad){$("osubj").value="";$("obody").value="";return}
  const name=[F.first,F.last].map(x=>x.trim()).filter(Boolean).join(" ");
  const rn=ROOM[el];
  const lines=c.sel.map(x=>`  • ${fdate(x.d,el,{weekday:"long",day:"numeric",month:"long"})}: ${c.rooms} × ${rn[x.type]} (${eur(PRICE[x.type],el)})`).join("\n");
  const contact=[F.email.trim(),F.phone.trim()].filter(Boolean).map(x=>"\n"+x).join("");
  const first=DAYS[c.ci], out=DAYS[c.co];
  const mail=MAIL[el]({name,ci:fdate(first,el,{day:"numeric",month:"short"}),co:fdate(out,el,{day:"numeric",month:"short",year:"numeric"}),
    ciL:fdate(first,el),coL:fdate(out,el),n:c.sel.length,g:c.guests,r:c.rooms,lines,notes:F.notes.trim().replace(/\s+/g," "),tot:eur(c.total,el),contact});
  $("osubj").value=mail.s; $("obody").value=mail.b;
}

function copy(id, btn){
  const el=document.getElementById(id), toast=document.getElementById("toast"), t=T[lang];
  const done=()=>{toast.textContent=t.copied; const o=btn.textContent; btn.textContent="✓"; setTimeout(()=>{btn.textContent=o;toast.textContent=""},2200)};
  const fail=()=>{el.focus();el.select();toast.textContent=t.copyFail};
  try{navigator.clipboard.writeText(el.value).then(done,fail)}catch(e){fail()}
}

function bindBook(){
  const save=()=>{store.set("st_form",F);refresh()};
  ["room","ci","co","satRoom"].forEach(k=>document.getElementById(k).addEventListener("change",e=>{F[k]=e.target.value;save()}));
  ["guests","rooms","first","last","email","phone","notes"].forEach(k=>document.getElementById(k).addEventListener("input",e=>{F[k]=e.target.value;save()}));
  document.querySelectorAll("[data-el]").forEach(b=>b.addEventListener("click",()=>{F.elang=b.dataset.el;document.querySelectorAll("[data-el]").forEach(x=>x.setAttribute("aria-pressed",x===b));save()}));
  document.getElementById("bf").addEventListener("submit",e=>e.preventDefault());
  document.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>copy(b.dataset.copy,b)));
  refresh();
}

/* ---------- render ---------- */
function render(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  const days=Math.ceil((Date.UTC(2027,5,25)-Date.now())/864e5);
  document.getElementById("count").innerHTML = days>0 ? t.days(days) : t.today;
  document.getElementById("tabs").innerHTML = Object.entries(t.tabs).map(([k,v])=>`<button role="tab" data-tab="${k}" aria-selected="${k===tab}" class="${k==="book"?"cta":""}">${v}</button>`).join("");
  const V={day:vDay,stay:vStay,book:vBook,travel:vTravel,todo:vTodo,qa:vQA};
  document.getElementById("main").innerHTML = V[tab](t);
  document.getElementById("foot").textContent = t.foot;
  if(tab==="book") bindBook();
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
  const a=document.querySelector(`[data-tab="${tab}"]`); if(a) a.scrollIntoView({block:"nearest",inline:"nearest"});
}
function go(k){tab=k;render();const n=document.querySelector("nav.tabs");if(n.getBoundingClientRect().top<0||window.scrollY>n.offsetTop)window.scrollTo({top:n.offsetTop});}

document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)go(b.dataset.tab)});
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.l;store.set("st_lang",lang);render()}));
const splash=document.getElementById("splash");
document.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{
  lang=b.dataset.pick; store.set("st_lang",lang);
  if(!store.get("st_form",null)) F.elang = lang==="it" ? "it" : "en";
  splash.hidden=true; document.body.style.overflow=""; render(); window.scrollTo({top:0});
}));

/* guest passkey */
const KEY_HASH="007b2781ae00a7d21ac27ab507a4f5682ad96051eb5d6b222075f04caad7f460";
function sha256(str){ /* compact SHA-256, used where crypto.subtle is unavailable */
  const K=[],H0=[];let n=2,c=0;const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};
  while(c<64){if(isP(n)){if(c<8)H0[c]=(Math.pow(n,.5)*4294967296)|0;K[c++]=(Math.pow(n,1/3)*4294967296)|0}n++}
  const b=unescape(encodeURIComponent(str)),w=[],l=b.length*8;for(let i=0;i<b.length;i++)w[i>>2]|=b.charCodeAt(i)<<((3-i%4)*8);
  w[l>>5]|=0x80<<(24-l%32);w[((l+64>>9)<<4)+15]=l;const h=H0.slice(),r=(x,y)=>(x>>>y)|(x<<(32-y));
  for(let j=0;j<w.length;j+=16){const W=Array.from({length:16},(_,k)=>w[j+k]|0);let[a,bb,cc,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){if(i>=16){const s0=r(W[i-15],7)^r(W[i-15],18)^(W[i-15]>>>3),s1=r(W[i-2],17)^r(W[i-2],19)^(W[i-2]>>>10);W[i]=(W[i-16]+s0+W[i-7]+s1)|0}
      const t1=hh+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+(W[i]|0),t2=(r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&cc)^(bb&cc));
      hh=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
    h[0]=(h[0]+a)|0;h[1]=(h[1]+bb)|0;h[2]=(h[2]+cc)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0}
  return h.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("");
}
function unlock(){
  document.getElementById("gate").hidden=true;
  document.getElementById("app").hidden=false;
  if(!store.get("st_lang",null)){splash.hidden=false;document.body.style.overflow="hidden";}
  render();
}
document.getElementById("gateForm").addEventListener("submit",e=>{
  e.preventDefault();
  const v=document.getElementById("pass").value.trim().toLowerCase();
  if(sha256(v)===KEY_HASH){store.set("st_ok",KEY_HASH);unlock();}
  else{const f=e.target,er=document.getElementById("gateErr");er.textContent="Wrong passkey · Code incorrect · Codice errato";
    f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");}
});
if(store.get("st_ok",null)===KEY_HASH) unlock(); else document.getElementById("pass").focus();
